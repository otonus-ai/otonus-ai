# Deploys public/ to the otonus.ai cPanel account on Namecheap hosting.
# Runs on every push to main that touches the site, or by hand from the Actions tab.
# FTP login details live in Bitwarden Secrets Manager; GitHub only holds the
# Bitwarden access token (secret BW_ACCESS_TOKEN) and the Bitwarden secret IDs
# (variables BW_FTP_SERVER_ID, BW_FTP_USERNAME_ID, BW_FTP_PASSWORD_ID).
name: Deploy to cPanel

on:
  push:
    branches: [main]
    paths: ["public/**", "src/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-otonus
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build index.html from src/page.html
        run: python3 src/build.py

      - name: Fetch FTP login from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            ${{ vars.BW_FTP_SERVER_ID }} > FTP_SERVER
            ${{ vars.BW_FTP_USERNAME_ID }} > FTP_USERNAME
            ${{ vars.BW_FTP_PASSWORD_ID }} > FTP_PASSWORD

      - name: Upload changed files over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          # The FTP account's home folder is public_html, so "./" is the site root.
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
